    <pattern id="ceiling" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#c88a52"/><rect width="30" height="3" fill="#a86d3e"/></pattern>
  </defs>
  <rect width="2400" height="1500" fill="url(#sky)"/>
