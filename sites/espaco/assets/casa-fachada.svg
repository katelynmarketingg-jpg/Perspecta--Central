<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER (barn house): substituir pela imagem real em alta (casa-fachada.jpg) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb2e0"/><stop offset=".7" stop-color="#cfe2f0"/><stop offset="1" stop-color="#e9eef0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7a184"/><stop offset=".5" stop-color="#8f6a58"/><stop offset="1" stop-color="#4c3a33"/></linearGradient>
    <linearGradient id="glassLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c69a"/><stop offset="1" stop-color="#a7714a"/></linearGradient>
    <pattern id="wood" width="2400" height="22" patternUnits="userSpaceOnUse"><rect width="2400" height="22" fill="#7a4a2c"/><rect y="19" width="2400" height="3" fill="#5c3620"/></pattern>
    <pattern id="woodV" width="26" height="40" patternUnits="userSpaceOnUse"><rect width="26" height="40" fill="#8a5734"/><rect width="3" height="40" fill="#5c3620"/></pattern>
